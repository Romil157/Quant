[project]
name = "quant"
version = "0.2.0"
description = "Quantitative finance research and backtesting platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=0.20",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "plotly>=5.20",
    "streamlit>=1.35",
    "typer>=0.12",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# CLI scripts and the dashboard are entry points that intentionally print to stdout/stderr
"scripts/*.py" = ["T201"]
"dashboard/*.py" = ["T201"]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true