# Research configuration
project:
  name: quant
  version: 0.1.0

data:
  raw_root: data/raw
  processed_root: data/processed
  cache_root: data/cache
  metadata_root: data/metadata

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s %(name)s: %(message)s"

providers:
  mock:
    enabled: true
  parquet:
    enabled: false
    data_root: data/raw
    provider: default
    asset_class: equities

research:
  universe: ["SPY", "QQQ", "IWM", "EFA", "EEM"]
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  timeframe: "1d"
  
  features:
    returns:
      windows: [1, 5, 10, 21, 63, 126, 252]
    trend:
      sma_windows: [10, 20, 50, 100, 200]
      ema_windows: [10, 20, 50, 100]
      momentum_windows: [21, 63, 126, 252]
    volatility:
      realized_windows: [21, 63, 126]
      ewma_spans: [21, 63]
    mean_reversion:
      rsi_windows: [14]
      bb_windows: [20]
      bb_std: 2.0
      zscore_windows: [20, 63]
    volume:
      volume_ma_windows: [21, 63]
      volume_zscore_windows: [63]

  walk_forward:
    train_window: 252
    validation_window: 63
    test_window: 63
    step: 63
    expanding: false

  experiment_tracking:
    enabled: true
    db_path: data/metadata/experiments.sqlite